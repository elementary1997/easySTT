name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Создаём черновик релиза, получаем его ID для параллельных сборок
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.cr.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release
        id: cr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --draft \
            --title "easySTT ${{ github.ref_name }}" \
            --notes "## Что нового

          - Микрофоны на Linux показываются с понятными названиями из PipeWire/PulseAudio, без служебных ALSA-дублей и выходов Monitor.
          - Исправлен захват звука с 16-битных микрофонов; выбранное устройство работает совместно с другими приложениями.
          - Возвращён компактный индикатор записи и обработки внизу по центру экрана. В ожидании все плавающие окна скрыты.
          - Добавлен тест выбора микрофона и жизненного цикла индикатора в Debian CI.

          На Linux диктовка (глобальный хоткей и вставка) требует X11; полноценная поддержка нативных Wayland-приложений пока отсутствует.

          ## Скачать

          | Файл | Платформа |
          |------|-----------|
          | \`easySTT_*_x64-setup.exe\` | Windows (Vulkan) |
          | \`easySTT_*_amd64.deb\` | Linux (Vulkan) |

          ## Требования

          - Установленный Vulkan-драйвер для твоей видеокарты (NVIDIA / AMD / Intel)

          ## Модели

          Скачай модель прямо в настройках (вкладка «Распознавание» → «Локальная модель»)."

          # tauri-action expects the numeric REST ID, not the GraphQL node ID.
          ID=$(gh release view "${{ github.ref_name }}" --json databaseId --jq '.databaseId')
          echo "release_id=$ID" >> $GITHUB_OUTPUT

  # Параллельные Vulkan-сборки Linux + Windows
  release-vulkan:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            name: Linux
          - platform: windows-latest
            name: Windows

    runs-on: ${{ matrix.platform }}
    name: Release Vulkan (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies + Vulkan SDK
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libpulse-dev \
            libxdo-dev \
            libssl-dev \
            libclang-dev \
            cmake \
            pkg-config

          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | \
            sudo gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/lunarg.gpg > /dev/null
          echo "deb https://packages.lunarg.com/vulkan jammy main" | \
            sudo tee /etc/apt/sources.list.d/lunarg-vulkan.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      - name: Install Vulkan SDK (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = (Invoke-RestMethod "https://vulkan.lunarg.com/sdk/latest/windows.json").windows
          $url = "https://sdk.lunarg.com/sdk/download/$version/windows/vulkan_sdk.exe"
          Invoke-WebRequest -Uri $url -OutFile "vulkan_sdk.exe"
          Start-Process -FilePath "vulkan_sdk.exe" -Wait `
            -ArgumentList "--accept-licenses --default-answer --confirm-command install"
          $sdkPath = (Get-ChildItem "C:\VulkanSDK" -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending | Select-Object -First 1).FullName
          if (-not $sdkPath) { throw "Vulkan SDK not found after installation" }
          "VULKAN_SDK=$sdkPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$sdkPath\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "VULKAN_SDK=$sdkPath"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: vulkan-${{ matrix.platform }}

      - run: npm ci

      - name: Build and upload (Vulkan)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: -- --features whisper-vulkan
