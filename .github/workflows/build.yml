name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  debian:
    name: Debian 13 native UI
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install build and smoke-test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential xz-utils cmake pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            libasound2-dev libxdo-dev libssl-dev libclang-dev \
            libvulkan-dev glslc \
            python3-gi gir1.2-atspi-2.0 at-spi2-core dbus xvfb xauth libgl1-mesa-dri
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: debian-13-vulkan
      - run: npm ci
      - name: Build Debian package (Vulkan)
        run: npx tauri build --bundles deb -- --features whisper-vulkan
      - name: Test native settings and tray-only operation
        env:
          # Docker on GitHub runners does not allow WebKit's nested sandbox.
          # This is scoped to the isolated CI smoke test, never the shipped app.
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
        run: xvfb-run -a dbus-run-session -- python3 scripts/debian_smoke.py src-tauri/target/release/easystt
      - uses: actions/upload-artifact@v4
        with:
          name: easystt-debian13-vulkan-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            name: Linux
          - platform: windows-latest
            name: Windows

    runs-on: ${{ matrix.platform }}
    name: Build Vulkan (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies + Vulkan SDK
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libxdo-dev \
            libssl-dev \
            libclang-dev \
            cmake \
            pkg-config

          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | \
            sudo gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/lunarg.gpg > /dev/null
          echo "deb https://packages.lunarg.com/vulkan jammy main" | \
            sudo tee /etc/apt/sources.list.d/lunarg-vulkan.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      - name: Install Vulkan SDK (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = (Invoke-RestMethod "https://vulkan.lunarg.com/sdk/latest/windows.json").windows
          $url = "https://sdk.lunarg.com/sdk/download/$version/windows/vulkan_sdk.exe"
          Invoke-WebRequest -Uri $url -OutFile "vulkan_sdk.exe"
          Start-Process -FilePath "vulkan_sdk.exe" -Wait `
            -ArgumentList "--accept-licenses --default-answer --confirm-command install"
          $sdkPath = (Get-ChildItem "C:\VulkanSDK" -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending | Select-Object -First 1).FullName
          if (-not $sdkPath) { throw "Vulkan SDK not found after installation" }
          "VULKAN_SDK=$sdkPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$sdkPath\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "VULKAN_SDK=$sdkPath"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: vulkan-${{ matrix.platform }}

      - run: npm ci

      - name: Build Tauri (Vulkan)
        run: npx tauri build -- --features whisper-vulkan

      - name: Upload Linux artifact
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: easystt-linux-vulkan-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Upload Windows artifact
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: easystt-windows-vulkan-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
